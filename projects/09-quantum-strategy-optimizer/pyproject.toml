[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-strategy-optimizer"
version = "0.1.0"
description = "Leakage-aware discrete strategy selection with classical search and QAOA"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.11,<2",
  "PyYAML>=6,<7", "qiskit>=2.2,<3", "optuna>=4.5,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["strategy_optimizer*", "project*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

