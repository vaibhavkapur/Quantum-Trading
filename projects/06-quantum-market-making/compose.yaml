services:
  metrics:
    build: .
    command: [python, -m, project.serve_metrics, --host, 0.0.0.0]
    volumes: ["./runs:/app/runs:ro"]
    ports: ["127.0.0.1:9108:9108"]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [metrics]
  grafana:
    image: grafana/grafana:12.1.0
    volumes:
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/default.yml:ro
      - ./monitoring/grafana/provider.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
      - ./monitoring/grafana/dashboard.json:/var/lib/grafana/dashboards/market-making.json:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
