[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qarb"
version = "0.1.0"
description = "Cross-venue arbitrage cycle detection: classical graph search vs QUBO/QAOA formulations (research code)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "networkx>=3.2",
  "pyyaml>=6.0",
  "qiskit>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
