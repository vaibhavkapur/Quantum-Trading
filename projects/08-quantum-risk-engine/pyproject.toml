[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-risk-engine"
version = "0.1.0"
description = "Reproducible classical and quantum-simulated portfolio tail-risk research"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "PyYAML>=6,<7", "fastapi>=0.115,<0.120", "pydantic>=2,<3", "uvicorn>=0.30,<0.39"]

[project.optional-dependencies]
quantum = ["qiskit>=2.2,<2.3"]
dev = ["pytest>=8,<9", "httpx>=0.27,<0.29"]

[tool.setuptools.packages.find]
include = ["risk*", "scenarios*", "quantum*", "project*", "api*", "benchmarks*"]

[tool.setuptools.package-data]
api = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
