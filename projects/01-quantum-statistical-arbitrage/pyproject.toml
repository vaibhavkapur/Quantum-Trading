[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-statarb"
version = "0.1.0"
description = "Quantum-assisted statistical arbitrage research engine (basket-selection QUBO, classical vs QAOA, event-driven backtest)"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "pyarrow>=16",
  "qiskit>=2.0",
  "ortools>=9.10",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: longer integration tests"]
