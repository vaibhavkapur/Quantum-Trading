# Demo experiment: synthetic daily OHLCV, 14-asset universe, walk-forward study.
# Every solver sees the same data, objective, constraints, splits and budget.
name: demo

data:
  source: synthetic          # synthetic | file (long-format CSV/Parquet, see README)
  dir: data/demo
  seed: 20240101
  n_days: 1700
  start: "2017-01-03"
  l2:                        # synthetic L2 quote stream for the Rust replay engine
    n_events: 400000
    seed: 7

walkforward:
  train_days: 378            # parameter fitting (pair stats, QUBO, hedge ratios)
  val_days: 126              # out-of-sample gate with frozen weights
  test_days: 126             # traded, never used for fitting
  step_days: 126

selection:
  basket_size: 4             # exact cardinality K (QUBO penalty)
  max_per_sector: 2          # hard constraint (feasibility + repair; exact pairwise penalty when 1)
  penalty_scale: 1.5
  weights:
    coint: 1.0               # reward: full-window residual ADF strength
    stability: 0.5           # reward: sub-window ADF strength x hedge-ratio stability
    resid_var: 0.5           # cost: 1 - R^2 of the pair regression
    half_life: 0.25          # cost: slow mean reversion
    cost: 0.1                # cost: quoted spread (linear)
    beta_dispersion: 0.25    # cost: (beta_i - beta_j)^2, market-neutrality surrogate
    sector: 0.1              # cost: same-sector concentration

hedge:
  method: johansen           # johansen | ols

gates:
  val_adf_pvalue: 0.10       # validation-window ADF on the frozen-weight spread
  max_half_life: 60
  max_asset_weight: 0.70

signal:
  entry_z: 2.0
  exit_z: 0.5
  stop_z: 4.0
  max_holding_halflives: 4.0
  cooldown_bars: 5

risk:
  capital: 1000000
  gross_leverage: 1.0
  max_asset_notional_frac: 0.70
  kill_switch_drawdown: 0.08

execution:
  latency_bars: 1            # signal on close t -> fill at open t+1
  fee_bps: 0.5
  book_levels: 5
  level_step: 0.5            # each deeper level costs +0.5 half-spreads
  depth_frac_adv: 0.01       # displayed size per level as a fraction of ADV
  beyond_book_bps: 25
  delist_haircut: 0.10

budget:
  max_evals: 64              # candidate bitstrings each stochastic solver may score
  time_limit_s: 5.0

solvers:
  classical: [brute_force, greedy, cpsat, random_search, simulated_annealing]
  quantum:
    backend: qiskit          # qiskit | numpy (same maths; cross-checked in tests)
    p: 2
    shots: 256               # shots per optimizer iteration
    maxiter: 40
    cvar_alpha: 0.5

seeds: [11, 23, 37, 41, 53]
