[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-order-book-predictor"
version = "0.1.0"
description = "Leakage-safe L2 forecasting with classical and simulated quantum classifiers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2",
  "polars>=1.0,<3", "PyYAML>=6,<7", "threadpoolctl>=3,<4",
  "pennylane>=0.43,<0.46", "torch>=2.5,<3", "xgboost>=2.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["orderbook*", "project*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
