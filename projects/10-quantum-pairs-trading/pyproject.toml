[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-pairs-trading"
version = "0.1.0"
description = "Leakage-safe pairs research with constrained classical and QAOA selection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "statsmodels>=0.14", "PyYAML>=6.0", "ortools>=9.10"]

[project.optional-dependencies]
quantum = ["qiskit>=2.0"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["pairs_trading*", "project*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

